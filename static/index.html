<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Apartment Finder</title>
    <style>
        :root {
            --bg: #F2F3F7;
            --card: #FFFFFF;
            --border: #E5E7EB;
            --text: #1D1D1F;
            --muted: #6B7280;
            --primary: #1A5F2A;
            --green: #22C55E;
            --green-dark: #15803D;
            --orange: #F59E0B;
            --orange-dark: #D97706;
            --danger: #EF4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--primary); color: #fff; padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10;
        }
        .header h1 { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .header h1 span { font-size: 24px; }
        .header-info { font-size: 12px; opacity: 0.85; }
        .header-actions { display: flex; gap: 8px; }
        .header-btn {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 6px 14px; border-radius: 8px; cursor: pointer;
            font-size: 12px; font-weight: 600; transition: background 0.2s;
            text-decoration: none; display: inline-block;
        }
        .header-btn:hover { background: rgba(255,255,255,0.25); }

        /* Main layout */
        .main { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 380px; background: var(--card); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-header {
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-header h2 { font-size: 15px; font-weight: 700; }
        .sidebar-count { font-size: 12px; color: var(--muted); font-weight: 500; }
        .legend {
            display: flex; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border);
            font-size: 11px; color: var(--muted);
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot {
            width: 14px; height: 14px; border-radius: 50%; display: inline-flex;
            align-items: center; justify-content: center; font-size: 8px; font-weight: 800; color: #fff;
        }
        .legend-dot.green { background: var(--green); }
        .legend-dot.orange { background: var(--orange); }
        .legend-line {
            width: 22px; height: 0; border-top: 4px solid #E31B23;
            border-radius: 999px; box-shadow: 0 0 0 2px #fff;
        }

        /* Filters */
        .filters {
            padding: 10px 16px; border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 8px;
        }
        .filter-row {
            display: flex; gap: 6px; align-items: center;
        }
        .filter-label { font-size: 11px; font-weight: 600; color: var(--muted); min-width: 36px; }
        .filter-btn {
            padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--card); color: var(--muted); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.15s;
        }
        .filter-btn:hover { border-color: var(--green); color: var(--text); }
        .filter-btn.active { background: var(--green); border-color: var(--green); color: #fff; }
        .sort-select {
            padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--card); color: var(--text); font-size: 12px; font-weight: 600;
            cursor: pointer; outline: none;
        }
        .sort-select:focus { border-color: var(--green); }

        .listings { flex: 1; overflow-y: auto; }

        .listing-card {
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            cursor: pointer; transition: background 0.15s; display: flex; gap: 12px;
        }
        .listing-card:hover { background: #F8FAFB; }
        .listing-card.active { background: #EBF5EB; border-left: 3px solid var(--green); }

        .listing-marker {
            width: 36px; height: 36px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 16px;
            font-weight: 800; color: #fff; flex-shrink: 0; margin-top: 2px;
        }
        .listing-marker.green { background: var(--green); }
        .listing-marker.orange { background: var(--orange); }

        .listing-info { flex: 1; min-width: 0; }
        .listing-price { font-size: 17px; font-weight: 800; }
        .listing-address { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .listing-meta { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
        .listing-meta span { display: flex; align-items: center; gap: 3px; }
        .listing-price-link {
            font-size: 17px; font-weight: 800; color: #1D1D1F; text-decoration: none;
            transition: color 0.15s;
        }
        .listing-price-link:hover { color: var(--primary); text-decoration: underline; }
        .listing-walk {
            margin-top: 4px; font-size: 12px; font-weight: 600;
        }
        .listing-walk a { text-decoration: none; transition: opacity 0.15s; }
        .listing-walk a:hover { opacity: 0.7; text-decoration: underline; }
        .listing-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .tag {
            font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
        }
        .tag.pass { background: #DCFCE7; color: var(--green-dark); }
        .tag.fail { background: #FEE2E2; color: #991B1B; }

        .listing-img {
            width: 72px; height: 54px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
        }

        /* Map */
        .map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        /* Loading */
        .loading-overlay {
            position: absolute; inset: 0; background: rgba(255,255,255,0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; font-weight: 600; color: var(--text); }
        .loading-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

        /* Error */
        .error-box {
            margin: 16px; padding: 16px; background: #FEE2E2; border: 1px solid #FECACA;
            border-radius: 10px; color: #991B1B; font-size: 13px;
        }
        .error-box strong { display: block; margin-bottom: 4px; }

        /* Empty */
        .empty-state {
            padding: 40px 20px; text-align: center; color: var(--muted);
        }
        .empty-state p { font-size: 14px; margin-top: 8px; }

        /* Info window */
        .info-window { font-family: inherit; max-width: 260px; background: #1D1D1F; color: #fff; padding: 14px; border-radius: 10px; margin: -8px -12px; }
        .info-window h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: #fff; }
        .info-window p { font-size: 12px; color: #ccc; margin: 2px 0; }
        .info-window a {
            display: inline-block; margin-top: 8px; background: var(--green); color: #fff;
            padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 45vh; border-right: none; border-top: 1px solid var(--border); }
            .map-container { height: 55vh; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1><span>🏠</span> SF Apartment Finder</h1>
            <div class="header-info">Rentals within 1.5mi of OpenAI Office &bull; Jul-Sep 2026</div>
        </div>
        <div class="header-actions">
            <a href="/" class="header-btn" style="background:rgba(255,255,255,0.35);">Rent</a>
            <a href="/buy" class="header-btn">Buy</a>
            <button class="header-btn" onclick="loadListings()">Refresh</button>
            <button class="header-btn" onclick="clearCache()">Clear Cache</button>
        </div>
    </div>

    <div class="main">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Best Matches</h2>
                <div style="text-align:right;">
                    <span class="sidebar-count" id="sidebar-count">Loading...</span>
                    <div id="data-source" style="font-size:10px;color:var(--green-dark);font-weight:600;margin-top:2px;"></div>
                </div>
            </div>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot green">2</span> All criteria met</div>
                <div class="legend-item"><span class="legend-dot orange">1</span> 2 of 3 criteria</div>
                <div class="legend-item"><span class="legend-line"></span> Muni T line</div>
            </div>
            <div class="filters">
                <div class="filter-row">
                    <span class="filter-label">Beds</span>
                    <button class="filter-btn active" data-beds="all" onclick="setBedFilter('all')">All</button>
                    <button class="filter-btn" data-beds="0" onclick="setBedFilter(0)">Studio</button>
                    <button class="filter-btn" data-beds="1" onclick="setBedFilter(1)">1 Bed</button>
                    <button class="filter-btn" data-beds="2" onclick="setBedFilter(2)">2 Bed</button>
                </div>
                <div class="filter-row">
                    <span class="filter-label">Sort</span>
                    <select class="sort-select" id="sort-select" onchange="setSortOrder(this.value)">
                        <option value="match">Best Match</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                        <option value="distance">Distance: Nearest</option>
                    </select>
                </div>
            </div>
            <div class="listings" id="listings"></div>
        </div>
        <div class="map-container">
            <div id="map"></div>
            <div class="loading-overlay" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">Finding apartments...</div>
                <div class="loading-sub">Searching near OpenAI Office</div>
            </div>
        </div>
    </div>

    <script>
        let map, markers = [], infoWindow, buildingMarker;
        let tLineOverlays = [];
        let listings = [];
        let activeListingId = null;
        let currentBedFilter = "all";
        let currentSort = "match";

        const T_LINE_ROUTE = [
            { lat: 37.7947, lng: -122.4078, name: "Chinatown-Rose Pak" },
            { lat: 37.7858, lng: -122.4064, name: "Union Square/Market St" },
            { lat: 37.7796, lng: -122.4085, name: "Yerba Buena/Moscone" },
            { lat: 37.7763, lng: -122.3949, name: "4th & Brannan" },
            { lat: 37.7736, lng: -122.3917, name: "UCSF/Chase Center" },
            { lat: 37.7696, lng: -122.3894, name: "Mission Rock" },
            { lat: 37.7666, lng: -122.3883, name: "Mariposa" },
            { lat: 37.7571, lng: -122.3888, name: "20th Street" },
            { lat: 37.7532, lng: -122.3888, name: "23rd Street" },
            { lat: 37.7490, lng: -122.3877, name: "Evans" },
            { lat: 37.7416, lng: -122.3877, name: "Kirkwood/La Salle" },
            { lat: 37.7340, lng: -122.3909, name: "Hudson/Innes" },
            { lat: 37.7290, lng: -122.3926, name: "Williams" },
            { lat: 37.7229, lng: -122.3951, name: "Carroll" },
            { lat: 37.7121, lng: -122.4021, name: "Sunnydale" },
        ];

        // --- Init ---
        async function init() {
            const config = await fetch("/api/config").then((r) => r.json());
            OPENAI_OFFICE = config.openaiOffice;
            if (config.mapsApiKey) {
                loadGoogleMaps(config.mapsApiKey, () => {
                    initMap(config.openaiOffice);
                    loadListings();
                });
            } else {
                // No Maps API key — init basic map placeholder and still load listings
                document.getElementById("map").innerHTML =
                    '<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#e5e7eb;color:#6b7280;font-size:14px;text-align:center;padding:20px;">Google Maps API key not configured.<br>Add MAPS_API_KEY to your .env file.<br>Listings will still load in the sidebar.</div>';
                document.getElementById("loading").style.display = "none";
                loadListings();
            }
        }

        function loadGoogleMaps(apiKey, callback) {
            const script = document.createElement("script");
            script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&callback=__gmapsReady`;
            script.async = true;
            script.defer = true;
            window.__gmapsReady = callback;
            document.head.appendChild(script);
        }

        function initMap(center) {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: center.lat, lng: center.lng },
                zoom: 14,
                mapTypeControl: false,
                streetViewControl: false,
                styles: [
                    { featureType: "poi", stylers: [{ visibility: "off" }] },
                    { featureType: "transit", stylers: [{ visibility: "simplified" }] },
                ],
            });
            infoWindow = new google.maps.InfoWindow();

            // OpenAI Office marker
            buildingMarker = new google.maps.Marker({
                position: { lat: center.lat, lng: center.lng },
                map: map,
                title: "OpenAI Office",
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 10,
                    fillColor: "#1A5F2A",
                    fillOpacity: 1,
                    strokeColor: "#fff",
                    strokeWeight: 3,
                },
                zIndex: 1000,
            });

            // Radius circle (1.5 miles = ~2414 meters)
            new google.maps.Circle({
                map: map,
                center: { lat: center.lat, lng: center.lng },
                radius: 2414,
                fillColor: "#22C55E",
                fillOpacity: 0.06,
                strokeColor: "#22C55E",
                strokeOpacity: 0.3,
                strokeWeight: 2,
            });

            drawTLineRoute();

            // OpenAI Office info
            google.maps.event.addListener(buildingMarker, "click", () => {
                infoWindow.setContent(`
                    <div class="info-window">
                        <h3>🏢 OpenAI Office</h3>
                        <p>Reference point for apartment search</p>
                        <p>1.5 mile radius (~30 min walk)</p>
                    </div>
                `);
                infoWindow.open(map, buildingMarker);
            });

            document.getElementById("loading").style.display = "none";
        }

        function drawTLineRoute() {
            tLineOverlays.forEach((overlay) => overlay.setMap(null));
            tLineOverlays = [];

            const path = T_LINE_ROUTE.map(({ lat, lng }) => ({ lat, lng }));
            const routeHalo = new google.maps.Polyline({
                path,
                map,
                strokeColor: "#FFFFFF",
                strokeOpacity: 0.95,
                strokeWeight: 10,
                zIndex: 20,
            });
            const routeLine = new google.maps.Polyline({
                path,
                map,
                strokeColor: "#E31B23",
                strokeOpacity: 0.95,
                strokeWeight: 6,
                zIndex: 21,
            });
            tLineOverlays.push(routeHalo, routeLine);

            T_LINE_ROUTE.forEach((station) => {
                const marker = new google.maps.Marker({
                    position: { lat: station.lat, lng: station.lng },
                    map,
                    title: `T Third - ${station.name}`,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 4,
                        fillColor: "#FFFFFF",
                        fillOpacity: 1,
                        strokeColor: "#E31B23",
                        strokeWeight: 2,
                    },
                    zIndex: 22,
                });
                google.maps.event.addListener(marker, "click", () => {
                    infoWindow.setContent(`
                        <div class="info-window">
                            <h3>T Third - ${station.name}</h3>
                            <p>Muni T line station</p>
                        </div>
                    `);
                    infoWindow.open(map, marker);
                });
                tLineOverlays.push(marker);
            });
        }

        // --- Load Listings ---
        async function loadListings() {
            const listingsEl = document.getElementById("listings");
            const countEl = document.getElementById("sidebar-count");
            const loadingEl = document.getElementById("loading");

            if (loadingEl) loadingEl.style.display = "flex";
            countEl.textContent = "Loading...";

            try {
                const data = await fetch("/api/listings").then((r) => r.json());

                if (data.error) {
                    listingsEl.innerHTML = `<div class="error-box"><strong>Error</strong>${data.error}</div>`;
                    countEl.textContent = "Error";
                    if (loadingEl) loadingEl.style.display = "none";
                    return;
                }

                listings = data.listings || [];
                countEl.textContent = `${listings.length} apartments`;
                const sourceEl = document.getElementById("data-source");
                if (data.source === "zillow_live") {
                    sourceEl.textContent = "Live from Zillow";
                    sourceEl.style.color = "var(--green-dark)";
                } else {
                    sourceEl.textContent = "Sample data (Zillow unavailable)";
                    sourceEl.style.color = "var(--orange-dark)";
                }

                if (listings.length === 0) {
                    listingsEl.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size:40px;">🏠</div>
                            <p>No apartments found matching all criteria.<br>Try adjusting filters or check back later.</p>
                        </div>`;
                    if (loadingEl) loadingEl.style.display = "none";
                    return;
                }

                applyFilters();

            } catch (err) {
                listingsEl.innerHTML = `<div class="error-box"><strong>Network Error</strong>${err.message}</div>`;
                countEl.textContent = "Error";
            }

            if (loadingEl) loadingEl.style.display = "none";
        }

        // --- Render Sidebar ---
        function walkingTime(miles) {
            const mins = Math.round(miles / 3.0 * 60); // ~3 mph walking speed
            return mins;
        }

        function walkingLabel(miles) {
            const mins = walkingTime(miles);
            if (mins < 60) return `${mins} min walk`;
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return `${h}h ${m}m walk`;
        }

        function directionsUrl(listing) {
            return `https://www.google.com/maps/dir/${OPENAI_OFFICE.lat},${OPENAI_OFFICE.lng}/${listing.lat},${listing.lng}/@${listing.lat},${listing.lng},15z/data=!3m1!4b1!4m2!4m1!3e2`;
        }

        function zillowUrl(listing) {
            if (listing.url && listing.url.startsWith("http")) return listing.url;
            // Fallback: link to Zillow SLO rental search filtered by bed count
            const beds = listing.bedrooms;
            if (beds === 0) return "https://www.zillow.com/san-luis-obispo-ca/rentals/?searchQueryState=%7B%22filterState%22%3A%7B%22isForRent%22%3A%7B%22value%22%3Atrue%7D%2C%22isForSaleByAgent%22%3A%7B%22value%22%3Afalse%7D%2C%22isForSaleByOwner%22%3A%7B%22value%22%3Afalse%7D%2C%22beds%22%3A%7B%22max%22%3A1%7D%7D%7D";
            if (beds === 1) return "https://www.zillow.com/san-luis-obispo-ca/rentals/1-_beds/?searchQueryState=%7B%22filterState%22%3A%7B%22isForRent%22%3A%7B%22value%22%3Atrue%7D%2C%22isForSaleByAgent%22%3A%7B%22value%22%3Afalse%7D%2C%22isForSaleByOwner%22%3A%7B%22value%22%3Afalse%7D%2C%22beds%22%3A%7B%22min%22%3A1%2C%22max%22%3A1%7D%7D%7D";
            return "https://www.zillow.com/san-luis-obispo-ca/rentals/2-_beds/?searchQueryState=%7B%22filterState%22%3A%7B%22isForRent%22%3A%7B%22value%22%3Atrue%7D%2C%22isForSaleByAgent%22%3A%7B%22value%22%3Afalse%7D%2C%22isForSaleByOwner%22%3A%7B%22value%22%3Afalse%7D%2C%22beds%22%3A%7B%22min%22%3A2%2C%22max%22%3A2%7D%7D%7D";
        }

        function renderListings(items) {
            const el = document.getElementById("listings");
            el.innerHTML = items.map((l) => {
                const walkMins = walkingTime(l.distance_miles);
                const walkColor = walkMins <= 15 ? "var(--green-dark)" : walkMins <= 30 ? "var(--orange-dark)" : "var(--muted)";
                const zUrl = zillowUrl(l);
                const dirUrl = directionsUrl(l);
                return `
                <div class="listing-card" data-id="${l.id}">
                    <div class="listing-marker ${l.marker}">${l.bedrooms}</div>
                    <div class="listing-info">
                        <a href="${zUrl}" target="_blank" class="listing-price-link" onclick="event.stopPropagation();">$${l.price.toLocaleString()}/mo ↗</a>
                        <div class="listing-address" title="${l.address}">${l.address}</div>
                        <div class="listing-meta">
                            <span>🛏 ${l.bedrooms} bed</span>
                            ${l.bathrooms ? `<span>🚿 ${l.bathrooms} bath</span>` : ""}
                            ${l.sqft ? `<span>📐 ${l.sqft} sqft</span>` : ""}
                            <span>📍 ${l.distance_miles} mi</span>
                        </div>
                        <div class="listing-walk">
                            <a href="${dirUrl}" target="_blank" onclick="event.stopPropagation();" style="color:${walkColor};">
                                🚶 ${walkingLabel(l.distance_miles)}
                            </a>
                        </div>
                        <div class="listing-tags">
                            <span class="tag ${l.location_ok ? 'pass' : 'fail'}">${l.location_ok ? '✓' : '✗'} Location</span>
                            <span class="tag ${l.price_ok ? 'pass' : 'fail'}">${l.price_ok ? '✓' : '✗'} Price</span>
                            <span class="tag ${l.date_ok ? 'pass' : 'fail'}">${l.date_ok ? '✓' : '✗'} Date</span>
                        </div>
                    </div>
                    ${l.image ? `<img class="listing-img" src="${l.image}" alt="" onerror="this.style.display='none'" onclick="selectListing('${l.id}')">` : ""}
                </div>`;
            }).join("");

            // Wire card clicks (but not on links)
            el.querySelectorAll(".listing-card").forEach((card) => {
                card.addEventListener("click", (e) => {
                    if (e.target.tagName === "A") return;
                    selectListing(card.dataset.id);
                });
            });
        }

        // Set from /api/config at init time. Default is a no-op safety value
        // so a missing config doesn't break the map.
        let OPENAI_OFFICE = { lat: 0, lng: 0 };

        // --- Render Map Markers ---
        function renderMarkers(items) {
            // Clear existing
            markers.forEach((m) => m.setMap(null));
            markers = [];

            const bounds = new google.maps.LatLngBounds();
            bounds.extend({ lat: OPENAI_OFFICE.lat, lng: OPENAI_OFFICE.lng });

            items.forEach((l) => {
                const isGreen = l.marker === "green";
                const marker = new google.maps.Marker({
                    position: { lat: l.lat, lng: l.lng },
                    map: map,
                    title: l.address,
                    label: {
                        text: String(l.bedrooms),
                        color: "#fff",
                        fontWeight: "800",
                        fontSize: "12px",
                    },
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 16,
                        fillColor: isGreen ? "#22C55E" : "#F59E0B",
                        fillOpacity: 1,
                        strokeColor: "#fff",
                        strokeWeight: 2,
                    },
                    zIndex: isGreen ? 100 : 50,
                });

                marker.listingId = l.id;

                google.maps.event.addListener(marker, "click", () => {
                    showInfoWindow(marker, l);
                    highlightCard(l.id);
                });

                markers.push(marker);
                bounds.extend({ lat: l.lat, lng: l.lng });
            });

            map.fitBounds(bounds, { padding: 60 });
        }

        function showInfoWindow(marker, l) {
            const zUrl = zillowUrl(l);
            const dirUrl = directionsUrl(l);
            infoWindow.setContent(`
                <div class="info-window">
                    <h3><a href="${zUrl}" target="_blank" style="color:#fff;text-decoration:none;font-weight:800;">$${l.price.toLocaleString()}/mo</a> &bull; ${l.bedrooms} bed</h3>
                    <p>${l.address}</p>
                    <p>📍 ${l.distance_miles} mi &bull; 🚶 ${walkingLabel(l.distance_miles)}</p>
                    ${l.sqft ? `<p>📐 ${l.sqft} sqft</p>` : ""}
                    <div style="display:flex;gap:6px;margin-top:8px;">
                        <a href="${zUrl}" target="_blank">View on Zillow ↗</a>
                        <a href="${dirUrl}" target="_blank" style="background:var(--orange);">Walking Directions</a>
                    </div>
                </div>
            `);
            infoWindow.open(map, marker);
        }

        // --- Interactions ---
        function selectListing(id) {
            const listing = listings.find((l) => String(l.id) === String(id));
            if (!listing) return;

            highlightCard(id);

            if (map) {
                const marker = markers.find((m) => String(m.listingId) === String(id));
                if (marker) {
                    map.panTo(marker.getPosition());
                    map.setZoom(16);
                    showInfoWindow(marker, listing);
                }
            }

            // Card click now just highlights + zooms map
            // Zillow link is on the price text
        }

        function highlightCard(id) {
            document.querySelectorAll(".listing-card").forEach((c) => c.classList.remove("active"));
            const card = document.querySelector(`.listing-card[data-id="${id}"]`);
            if (card) {
                card.classList.add("active");
                card.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
            activeListingId = id;
        }

        // --- Filter & Sort ---
        function setBedFilter(beds) {
            currentBedFilter = beds;
            document.querySelectorAll(".filter-btn").forEach((b) => {
                b.classList.toggle("active", String(b.dataset.beds) === String(beds));
            });
            applyFilters();
        }

        function setSortOrder(sort) {
            currentSort = sort;
            applyFilters();
        }

        function applyFilters() {
            let filtered = [...listings];

            // Bed filter
            if (currentBedFilter !== "all") {
                filtered = filtered.filter((l) => l.bedrooms === currentBedFilter);
            }

            // Sort
            switch (currentSort) {
                case "price_asc":
                    filtered.sort((a, b) => a.price - b.price);
                    break;
                case "price_desc":
                    filtered.sort((a, b) => b.price - a.price);
                    break;
                case "distance":
                    filtered.sort((a, b) => a.distance_miles - b.distance_miles);
                    break;
                default: // "match" — green first, then distance
                    filtered.sort((a, b) => (a.marker === "green" ? 0 : 1) - (b.marker === "green" ? 0 : 1) || a.distance_miles - b.distance_miles);
            }

            document.getElementById("sidebar-count").textContent = `${filtered.length} of ${listings.length} apartments`;
            renderListings(filtered);
            if (map) renderMarkers(filtered);
        }

        async function clearCache() {
            await fetch("/api/cache/clear");
            loadListings();
        }

        // --- Boot ---
        init();
    </script>
</body>
</html>
